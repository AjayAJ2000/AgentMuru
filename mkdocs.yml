site_name: AgentMuru
site_description: Python-native runtime and workspace for observable, governed AI applications
site_url: https://ajayaj2000.github.io/AgentMuru/
repo_url: https://github.com/AjayAJ2000/AgentMuru
repo_name: AjayAJ2000/AgentMuru
theme:
  name: material
  logo: assets/agentmuru-mark.png # exact DataMuru approved Hybrid Vel Eye master
  favicon: assets/agentmuru-favicon-64.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
nav:
  - Home: index.md
  - Start:
      - Choose a path: getting-started.md
      - Installation: getting-started/installation.md
      - Five-minute local quickstart: getting-started/quickstart.md
  - Tutorials:
      - Choose a tutorial: cookbook/index.md
      - Govern tool execution: cookbook/governed-tools.md
      - Create artifacts: cookbook/artifacts.md
      - Reopen durable sessions: cookbook/durable-sessions.md
      - Run workflows and handoffs: cookbook/workflows-and-handoffs.md
      - Check Databricks readiness: cookbook/databricks.md
  - How-to guides:
      - Run the server and Workspace: guides/server-and-workspace.md
      - Persist sessions with SQLite: guides/sqlite-persistence.md
      - Deploy AgentMuru: guides/deployment.md
      - Add a model provider: guides/model-provider.md
      - Add a session store: guides/session-store.md
      - Secure a deployment: guides/security.md
      - Connect Databricks: guides/databricks.md
  - Concepts:
      - Runtime and events: concepts/runtime-and-events.md
      - Agents and models: concepts/agents-and-models.md
      - Tools and approvals: concepts/tools-and-approvals.md
      - Sessions and memory: concepts/sessions-and-memory.md
      - Artifacts and traces: concepts/artifacts-and-traces.md
      - Workflows and handoffs: concepts/workflows-and-handoffs.md
  - Reference:
      - Stable public API: reference/public-api.md
      - Current capabilities and limits: integration-status.md
      - Release notes: CHANGELOG.md
      - Upgrade custom stores to 0.2: migration-custom-stores-0.2.md
      - Move from the legacy UI: migration-from-legacy-ui.md
      - Product roadmap: product/roadmap.md
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
strict: true
extra_css:
  - stylesheets/agentmuru.css
