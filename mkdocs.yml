site_name: AgentMuru
site_description: Python-native runtime and workspace for observable, governed AI applications
site_url: https://ajayaj2000.github.io/agentmuru/
repo_url: https://github.com/AjayAJ2000/agentmuru
repo_name: AjayAJ2000/agentmuru
theme:
  name: material
  palette:
    scheme: slate
    primary: green
    accent: green
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Runtime and events: concepts/runtime-and-events.md
      - Agents and models: concepts/agents-and-models.md
      - Tools and approvals: concepts/tools-and-approvals.md
      - Sessions and memory: concepts/sessions-and-memory.md
      - Artifacts and traces: concepts/artifacts-and-traces.md
      - Workflows and handoffs: concepts/workflows-and-handoffs.md
  - Guides:
      - Add a model provider: guides/model-provider.md
      - Add a session store: guides/session-store.md
      - Secure a deployment: guides/security.md
      - Databricks: guides/databricks.md
  - Architecture:
      - Current state: architecture/current-state.md
      - Target state: architecture/target-state.md
      - Transformation log: architecture/ai-native-transformation.md
      - Decisions: architecture/decisions.md
  - Migration: migration-from-legacy-ui.md
  - Changelog: CHANGELOG.md
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
strict: true
