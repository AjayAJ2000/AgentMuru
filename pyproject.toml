[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentmuru"
version = "0.1.0"
description = "A Python-native runtime and workspace for observable, human-governed AI applications."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "AgentMuru Contributors" }]
keywords = ["ai", "agents", "runtime", "tools", "workflows", "human-in-the-loop", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "typer>=0.12.0",
    "python-dotenv>=1.2.2",
    "websockets>=12.0",
    "starlette>=0.37.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
databricks = [
    "databricks-sdk>=0.20.0",
    "databricks-sql-connector>=3.0.0",
    "pandas>=2.0.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
]
all = [
    "agentmuru[databricks,dev,docs]",
]

[project.scripts]
muru = "agentmuru.cli.main:app"

[project.urls]
Homepage = "https://github.com/AjayAJ2000/AgentMuru"
Documentation = "https://ajayaj2000.github.io/AgentMuru/"
Repository = "https://github.com/AjayAJ2000/AgentMuru"
Issues = "https://github.com/AjayAJ2000/AgentMuru/issues"

[tool.hatch.build.targets.wheel]
packages = ["agentmuru"]

[tool.hatch.build]
artifacts = [
  "agentmuru/frontend/dist/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/agentmuru",
    "/docs",
    "/examples",
    "/tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
