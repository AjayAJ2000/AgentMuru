name: Documentation issue
description: Report unclear, incorrect, missing, or outdated AgentMuru documentation.
title: "[Docs] "
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page or section
      description: Link to the affected page when possible.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should the documentation say or demonstrate?
    validations:
      required: true
