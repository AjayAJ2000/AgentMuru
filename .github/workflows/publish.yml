name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  qualification:
    name: Verify, build, and qualify once
    if: '!github.event.release.prerelease'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify release tag matches package version
        shell: bash
        run: |
          version="$(python -c 'from agentmuru.version import __version__; print(__version__)')"
          test "${GITHUB_REF_NAME}" = "agentmuru-v${version}"

      - name: Install verification dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,docs,providers]"
          python -m pip install build twine
          npm ci --prefix frontend

      - name: Verify Python
        run: |
          python -m pytest -q
          python -m ruff check agentmuru tests qualification examples
          python -m mypy agentmuru

      - name: Verify and build Workspace
        working-directory: frontend
        run: |
          npm test -- --run
          npm run lint
          npm run typecheck
          npm run build
          npm run test:bundle
          npm run check:bundle

      - name: Build documentation strictly
        run: python -m mkdocs build --strict

      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Qualify installed wheel
        run: >-
          python qualification/run_clean_install.py
          --wheel dist/agentmuru-0.3.0-py3-none-any.whl
          --report .tmp/qualification.json

      - name: Upload qualified distributions
        uses: actions/upload-artifact@v7
        with:
          name: agentmuru-qualified-distributions
          path: dist/*

      - name: Upload qualification report
        uses: actions/upload-artifact@v7
        with:
          name: agentmuru-qualification
          path: .tmp/qualification.json

  publish:
    name: Publish qualified distributions to PyPI
    runs-on: ubuntu-latest
    needs: [qualification]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download qualified distributions
        uses: actions/download-artifact@v8
        with:
          name: agentmuru-qualified-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
