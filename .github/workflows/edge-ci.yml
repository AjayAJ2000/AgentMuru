name: Native edge CI

on:
  workflow_dispatch:
    inputs:
      build_llama:
        description: "Build pinned Windows llama.cpp variants"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "edge/**"
      - "packs/**"
      - "qualification/edge/**"
      - "schemas/**"
      - ".github/workflows/edge-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "edge/**"
      - "packs/**"
      - "qualification/edge/**"
      - "schemas/**"
      - ".github/workflows/edge-ci.yml"

permissions:
  contents: read

jobs:
  native:
    name: Go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: edge
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: edge/go.mod
          cache-dependency-path: edge/go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -o muru${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/muru

      - name: Qualify action-router simulation
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: ./qualification/edge/action_router_simulation.ps1 -GoExecutable go

  llama-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.build_llama
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build pinned CPU variants
        shell: pwsh
        run: ./tools/build-llama-windows.ps1
      - name: Upload unsigned qualification artifacts
        uses: actions/upload-artifact@v7
        with:
          name: llama-windows-qualification
          path: artifacts/llama-windows/
