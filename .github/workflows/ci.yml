name: CI

on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [dev, test, main]

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run Python tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Run Python lint and type checks
        run: |
          python -m ruff check agentmuru tests qualification examples
          python -m mypy agentmuru

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install mkdocs mkdocs-material build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend type check
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend build
        working-directory: frontend
        run: npm run build

      - name: Enforce frontend bundle budgets
        working-directory: frontend
        run: |
          npm run test:bundle
          npm run check:bundle

      - name: Build docs
        run: python -m mkdocs build --strict

      - name: Build package
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: agentmuru-distributions
          path: dist/*

  qualification:
    name: Clean-wheel qualification
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: agentmuru-distributions
          path: dist

      - name: Qualify installed wheel
        run: >-
          python qualification/run_clean_install.py
          --wheel dist/agentmuru-0.2.0-py3-none-any.whl
          --report .tmp/qualification.json

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: agentmuru-qualification
          path: .tmp/qualification.json
